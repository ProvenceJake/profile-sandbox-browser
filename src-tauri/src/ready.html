<!doctype html>
<html>
  <meta charset="utf-8" /><title>PROFILE_LABEL · Profile Harbor</title>
  <style>
    :root {
      color-scheme: light dark;
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      --bg: #f5f5f7; --surface: white; --ink: #1d1d1f; --secondary: #60616a; --line: #e7e7eb;
    }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); }
    main { box-sizing: border-box; width: min(560px, calc(100% - 32px)); padding: clamp(24px, 5vw, 48px); background: var(--surface); border: 1px solid var(--line); border-radius: 24px; }
    small { color: var(--secondary); font-weight: 600; }
    h1 { font-size: clamp(32px, 5vw, 48px); letter-spacing: -.035em; line-height: 1.15; margin: 10px 0 24px; overflow-wrap: anywhere; }
    #region { margin: 0; padding-top: 20px; border-top: 1px solid var(--line); overflow-wrap: anywhere; }
    time { display: block; margin-top: 4px; color: var(--secondary); font-variant-numeric: tabular-nums; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #19191b; --surface: #29292c; --ink: #f5f5f7; --secondary: #abadb5; --line: #3a3a3d; }
    }
  </style>
  <main>
    <small>Profile Harbor</small>
    <h1>PROFILE_LABEL</h1>
    <p id="region"></p>
    <time id="clock"></time>
    <script>
      const locale = navigator.language;
      document.documentElement.lang = locale;
      document.documentElement.dir = "auto";
      const format = new Intl.DateTimeFormat(locale, { dateStyle: "full", timeStyle: "short" });
      const language = new Intl.DisplayNames([locale], { type: "language" }).of(locale);
      document.getElementById("region").textContent = language + " · " + format.resolvedOptions().timeZone;
      const clock = document.getElementById("clock");
      function tick() {
        const now = new Date();
        clock.dateTime = now.toISOString();
        clock.textContent = format.format(now);
        setTimeout(tick, 60000 - now.getTime() % 60000);
      }
      tick();
    </script>
  </main>
</html>
