[package]
name = "profile-harbor"
version = "0.11.0"
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "custom-protocol"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
rusqlite = "0.37"
reqwest = { version = "0.12", default-features = false, features = ["blocking","native-tls","json","system-proxy"] }
uuid = { version = "1", features = ["v4","v5"] }
libc = "0.2"
security-framework = "3"
maxminddb = { version = "0.26", features = ["mmap"] }
tzf-rs = "2"
tempfile = "3"
flate2 = "1"
sha2 = "0.10"
url = "2"
fs2 = "0.4"
tokio = {version="1",features=["net","io-util","rt-multi-thread","sync","time","macros"]}
[profile.release]
strip = true
debug = false
incremental = false
[profile.dev]
debug = 0
incremental = false
